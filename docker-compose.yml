services:
  api:
    build: .
    environment:
      SCRIPTGRAPH_DEMO_MODE: "false"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: scriptgraph-local
      # Set this to enable sentence-transformers + FAISS in a custom image with the vector extra.
      SCRIPTGRAPH_EMBEDDING_MODEL: ""
    ports: ["8000:8000"]
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/scriptgraph-local
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p scriptgraph-local 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes: ["./web:/app"]
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  neo4j_data:
