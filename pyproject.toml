[project]
name = "scriptgraph-rag"
version = "0.1.0"
description = "Evidence-grounded GraphRAG for screenplay continuity and change impact analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dai Zhouchen" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.23,<6"]
vector = ["faiss-cpu>=1.8,<2", "sentence-transformers>=3,<4"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
scriptgraph-generate = "scriptgraph.data:main"
scriptgraph-eval = "scriptgraph.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptgraph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

