name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run python -m scriptgraph.data --output data
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run python -m scriptgraph.eval --data data --output reports/baseline.json
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build -t scriptgraph-ci .
      - run: docker run -d --name scriptgraph-ci -p 8000:8000 scriptgraph-ci
      - name: Smoke test container
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs scriptgraph-ci
          exit 1
      - if: always()
        run: docker logs scriptgraph-ci
